# Diagnosis: pasang APK rilis terbaru di emulator Android, buka, lalu simpan logcat + screenshot.
# Tab Actions → "Diagnosis APK di emulator" → Run workflow. Hasil ada di Artifacts.
name: Diagnosis APK di emulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Unduh APK rilis terbaru
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern '*.apk' --output app.apk

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Jalankan APK di emulator (Android 11)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p diag
            adb logcat -c
            adb install -r app.apk
            adb shell pm list packages | grep -iE 'chrome|webview|browser' > diag/browsers.txt || true
            adb shell cmd package resolve-activity --brief -a android.intent.action.VIEW -d https://${{ github.repository_owner }}.github.io/ > diag/default-browser.txt || true
            adb shell cmd uimode night yes
            adb shell cmd overlay enable com.android.internal.systemui.navbar.gestural || true
            adb shell "echo '_ --disable-fre --no-default-browser-check --no-first-run --disable-features=Translate' > /data/local/tmp/chrome-command-line"
            adb shell am set-debug-app --persistent com.android.chrome
            adb shell monkey -p com.dashfood.pos -c android.intent.category.LAUNCHER 1
            sleep 25
            # buka ulang: notifikasi "Running in Chrome" hanya muncul di pembukaan pertama dan menutupi bagian bawah
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell monkey -p com.dashfood.pos -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml diag/ui.xml || true
            OK=$(grep -o 'text="OK"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' diag/ui.xml | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | tr '[],' '   ' | awk '{print int(($1+$3)/2), int(($2+$4)/2)}'); [ -n "$OK" ] && adb shell input tap $OK || true
            sleep 3
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' > diag/top-activity.txt || true
            adb exec-out screencap -p > diag/screen.png
            adb logcat -d > diag/logcat-full.txt
            grep -E 'AndroidRuntime|FATAL|dashfood|browserhelper|TwaLauncher|CustomTabs|LauncherActivity' diag/logcat-full.txt > diag/logcat-app.txt || true
            if grep -q 'FATAL EXCEPTION' diag/logcat-full.txt; then echo "::error::APK crash, lihat logcat-app.txt"; exit 1; fi
            if ! grep -q 'com.android.chrome' diag/top-activity.txt; then echo "::error::Setelah dibuka, layar teratas bukan TWA di Chrome"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnosis
          path: diag/
