<script>
/* =========================================================================
   Dash Food POS — client
   - Router internal berbasis stack (screen = fungsi render + mount).
   - Semua aksi lewat event delegation: [data-act], [data-input], [data-change], form[data-submit].
     Handler yang tidak terdaftar terdeteksi oleh test "no dead buttons".
   - Harga di UI berasal dari catalog API; total final dari backend.
   ========================================================================= */
(function () {
  'use strict';

  /* ------------------------------------------------------------------ utils */
  var app = document.getElementById('app');
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function groupThousands(n) { return String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function rp(n) { n = Number(n) || 0; return (n < 0 ? '-' : '') + 'Rp ' + groupThousands(n); }
  function num(n) { return (Number(n) < 0 ? '-' : '') + groupThousands(Number(n) || 0); }
  function rpShort(n) {
    n = Number(n) || 0;
    var a = Math.abs(n), s;
    if (a >= 1e9) s = (a / 1e9).toFixed(a % 1e9 ? 2 : 0).replace('.', ',') + ' M';
    else if (a >= 1e6) s = (Math.round(a / 1e4) / 100).toString().replace('.', ',') + ' jt';
    else if (a >= 1e3) s = (Math.round(a / 100) / 10).toString().replace('.', ',') + ' rb';
    else s = String(a);
    return (n < 0 ? '-' : '') + 'Rp ' + s;
  }
  function parseRp(v) { var d = String(v || '').replace(/[^\d]/g, ''); return d ? parseInt(d, 10) : null; }
  function fmtDate(d) {
    if (!d) return '-';
    var p = String(d).substring(0, 10).split('-');
    if (p.length !== 3) return d;
    return parseInt(p[2], 10) + ' ' + MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  function fmtDateShort(d) { var p = String(d).split('-'); return p[2] + '/' + p[1]; }
  function fmtTimeIso(iso) { var m = String(iso || '').match(/T(\d{2}:\d{2})/); return m ? m[1] : ''; }
  function initials(name) {
    var w = String(name || '?').trim().split(/\s+/);
    return ((w[0] || '')[0] + ((w[1] || '')[0] || '')).toUpperCase();
  }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  }
  function icon(name, cls) { return '<svg class="icon ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + name + '"></use></svg>'; }
  function pct(v) { return (v > 0 ? '+' : '') + String(v).replace('.', ',') + '%'; }
  function store(key, val) {
    try {
      if (val === undefined) { var r = localStorage.getItem('df_' + key); return r ? JSON.parse(r) : null; }
      if (val === null) localStorage.removeItem('df_' + key); else localStorage.setItem('df_' + key, JSON.stringify(val));
    } catch (e) { return null; }
    return null;
  }
  function debounce(fn, ms) { var t; return function () { var a = arguments, s = this; clearTimeout(t); t = setTimeout(function () { fn.apply(s, a); }, ms); }; }

  /* ------------------------------------------------------------------ tema */
  function themePref() { var t = store('theme'); return t === 'light' || t === 'dark' ? t : 'auto'; }
  /** Tema warna (aksen). Warna di sini hanya untuk contoh bulat di pengaturan; nilai sebenarnya di Styles (token). */
  var ACCENTS = [['orange', 'Oranye', '#C84B09'], ['green', 'Hijau', '#167A44'], ['blue', 'Biru', '#1F5FD6'], ['maroon', 'Marun', '#A3263D'], ['brown', 'Cokelat', '#7A4E31']];
  function accentPref() { var a = store('accent'); return ACCENTS.some(function (x) { return x[0] === a; }) ? a : 'orange'; }
  function applyAccent(a) { if (a && a !== 'orange') document.documentElement.setAttribute('data-accent', a); else document.documentElement.removeAttribute('data-accent'); }
  applyAccent(accentPref());
  function applyTheme(t) {
    var root = document.documentElement;
    if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  }
  applyTheme(themePref());
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function () { if (themePref() === 'auto') { try { syncChrome(); } catch (e) { /* belum siap */ } } };
    if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
  }

  /* ------------------------------------------------------------------ API */
  var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  /** Mode PWA (GitHub Pages): URL /exec Apps Script diisi di config.js → window.DF_API_URL. */
  var API_URL = !IS_GAS && window.DF_API_URL ? String(window.DF_API_URL) : '';
  var API_TIMEOUT_MS = 60000;
  function handleRes(action, res, resolve, reject) {
    if (!res) { reject({ code: 'EMPTY', message: 'Respons kosong dari server.' }); return; }
    if (res.ok) { resolve(res.data); return; }
    if (res.error && res.error.code === 'AUTH_REQUIRED' && action !== 'login') sessionExpired(res.error.message);
    reject(res.error || { code: 'UNKNOWN', message: 'Terjadi kesalahan.' });
  }
  function netErr(detail) {
    return { code: 'NETWORK', message: 'Gagal terhubung ke server. Periksa koneksi lalu coba lagi.' + (detail ? ' (' + detail + ')' : '') };
  }
  function api(action, payload) {
    return new Promise(function (resolve, reject) {
      if (IS_GAS) {
        google.script.run
          .withSuccessHandler(function (res) { handleRes(action, res, resolve, reject); })
          .withFailureHandler(function (err) { reject(netErr(err && err.message)); })
          .api(action, payload || {}, S.token);
        return;
      }
      if (!API_URL) { reject({ code: 'NO_BACKEND', message: 'Backend belum diatur. Isi URL Web App Apps Script di config.js.' }); return; }
      // text/plain = "simple request": tanpa preflight CORS (Apps Script tidak melayani OPTIONS).
      var ctrl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, API_TIMEOUT_MS);
      fetch(API_URL, {
        method: 'POST', redirect: 'follow', cache: 'no-store', credentials: 'omit',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: payload || {}, token: S.token || null }),
        signal: ctrl ? ctrl.signal : undefined
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function (txt) {
        clearTimeout(timer);
        var res;
        try { res = JSON.parse(txt); } catch (e) {
          // Biasanya halaman login Google: deployment belum diberi akses "Anyone" (Siapa saja).
          reject({ code: 'BAD_RESPONSE', message: 'Server tidak mengembalikan data. Pastikan Web App di-deploy dengan akses "Anyone" (Siapa saja).' });
          return;
        }
        handleRes(action, res, resolve, reject);
      }, function (e) {
        clearTimeout(timer);
        reject(netErr(e && e.name === 'AbortError' ? 'waktu habis' : (navigator.onLine === false ? 'sedang offline' : (e && e.message))));
      });
    });
  }

  /* ------------------------------------------------------------------ state */
  var S = {
    token: store('token'), user: null, settings: null, enums: null, labels: null, today: '', pub: null,
    stack: [], data: {}, catalog: null, catalogAt: 0,
    channel: 'OFFLINE', cart: [], cartVersion: 0, cartRef: uuid(), discount: 0, orderNote: '', extId: '',
    pendingOrder: null, pd: null, pay: null, kasir: { q: '', cat: '' }, orders: { period: 'today', channel: '', status: '', q: '' },
    stockTab: 'PRODUCT', expenses: { period: 'month', category: '' }, dash: { period: 'today' },
    rep: { period: '7d', channel: '' }, chartSel: null, prices: { type: 'PRODUCT', id: '' }
  };
  (function restoreCart() {
    var c = store('cart');
    if (c && Array.isArray(c.cart)) {
      S.cart = c.cart; S.channel = c.channel || 'OFFLINE'; S.discount = c.discount || 0; S.orderNote = c.orderNote || '';
      S.extId = c.extId || ''; S.cartRef = c.cartRef || uuid(); S.cartVersion = c.cartVersion || 0;
      S.editing = c.editing || null; S.stash = c.stash || null;
    }
  })();
  function saveCart() {
    store('cart', { cart: S.cart, channel: S.channel, discount: S.discount, orderNote: S.orderNote, extId: S.extId,
      cartRef: S.cartRef, cartVersion: S.cartVersion, editing: S.editing || null, stash: S.stash || null });
  }
  /** Setiap perubahan isi order → versi baru & client_ref baru (idempotency createOrder). */
  function cartChanged() { S.cartVersion++; S.cartRef = uuid(); saveCart(); }

  var ROLE_RANK = { STAFF: 1, MANAGER: 2, ADMIN: 3 };
  function hasRole(r) { return S.user && ROLE_RANK[S.user.role] >= ROLE_RANK[r]; }
  function chLabel(c) { return (S.labels && S.labels.CHANNELS[c]) || c; }
  function pmLabel(c) { return (S.labels && S.labels.PAYMENT_METHODS[c]) || c; }

  /* --------------------------------------------------------- data loader */
  /**
   * Data layer "stale-while-revalidate" — layar tidak pernah menunggu bila datanya pernah dimuat:
   *  1. Ada di memori → tampil langsung. Bila umurnya > STALE_MS atau ditandai basi, diambil ulang di belakang
   *     (bar tipis di atas layar) lalu layar diperbarui.
   *  2. Belum di memori tapi ada di cache perangkat (dari sesi sebelumnya) → tampil langsung + diambil ulang.
   *  3. Belum pernah → skeleton sampai data datang.
   * Harga/stok untuk TRANSAKSI tetap divalidasi server (createOrder/recordPayment), jadi data tampilan yang
   * sedikit usang tidak bisa menyebabkan transaksi salah.
   */
  var STALE_MS = 20000;
  var rerender = function () { render(); };
  var inflight = 0;
  function setRefreshing(delta) {
    inflight = Math.max(0, inflight + delta);
    var bar = document.getElementById('refresh-bar');
    if (inflight && !bar) { bar = document.createElement('div'); bar.id = 'refresh-bar'; bar.className = 'refresh-bar'; bar.setAttribute('aria-hidden', 'true'); document.body.appendChild(bar); }
    if (!inflight && bar) bar.parentNode.removeChild(bar);
  }
  /* --- cache perangkat (localStorage), per pengguna, dibatasi ukuran --- */
  var DC_MAX_ENTRY = 150000, DC_MAX_KEYS = 40;
  function dcKey(key) { return S.user ? 'dc|' + S.user.user_id + '|' + key : null; }
  function dcGet(key) { var k = dcKey(key); return k ? store(k) : null; }
  function dcSet(key, v) {
    var k = dcKey(key);
    if (!k || /^order\|/.test(key)) return; // detail order tidak disimpan di perangkat
    try {
      var json = JSON.stringify({ v: v, at: Date.now() });
      if (json.length > DC_MAX_ENTRY) return;
      var idx = store('dcidx') || [];
      idx = idx.filter(function (x) { return x !== k; }); idx.push(k);
      while (idx.length > DC_MAX_KEYS) store(idx.shift(), null);
      store('dcidx', idx);
      localStorage.setItem('df_' + k, json);
    } catch (e) { /* penyimpanan penuh/diblokir: abaikan */ }
  }
  function dcClear() { (store('dcidx') || []).forEach(function (k) { store(k, null); }); store('dcidx', null); store('bootc', null); }

  function fetchInto(key, loader, d, background, quiet) {
    d.refreshing = true;
    var bar = background && !quiet;
    if (bar) setRefreshing(1);
    loader().then(function (v) {
      if (bar) setRefreshing(-1);
      if (S.data[key] !== d) return;
      S.data[key] = { status: 'ok', value: v, at: Date.now() };
      dcSet(key, v);
      if (!background || visibleKey(key)) rerender();
    }, function (e) {
      if (bar) setRefreshing(-1);
      if (S.data[key] !== d) return;
      if (background && d.status === 'ok') {
        // Data lama tetap tampil; coba lagi di kunjungan berikutnya.
        d.refreshing = false; d.stale = false; d.at = Date.now() - STALE_MS + 5000;
        if (e && e.code !== 'AUTH_REQUIRED' && visibleKey(key)) toast('Gagal memperbarui data. Menampilkan data terakhir.', 'warn');
        return;
      }
      S.data[key] = { status: 'error', error: e };
      rerender();
    });
  }
  var renderKeys = {};
  function visibleKey(key) { return !!renderKeys[key]; }
  function useData(key, loader) {
    renderKeys[key] = true;
    var d = S.data[key];
    if (!d) {
      var cached = dcGet(key);
      if (cached) {
        d = S.data[key] = { status: 'ok', value: cached.v, at: cached.at, stale: true };
      } else {
        d = S.data[key] = { status: 'loading' };
        fetchInto(key, loader, d, false);
        return d;
      }
    }
    if (d.status === 'ok' && !d.refreshing && (d.stale || Date.now() - (d.at || 0) > STALE_MS)) {
      // ditunda satu tick: render yang sedang berjalan selesai dulu
      setTimeout(function () { if (S.data[key] === d && !d.refreshing) fetchInto(key, loader, d, true); }, 0);
    }
    return d;
  }
  /** Ambil data di belakang tanpa menampilkan apa pun (untuk tab yang kemungkinan dibuka berikutnya). */
  function prefetch(key, loader) {
    if (S.data[key] && S.data[key].status !== 'error') return;
    var cached = dcGet(key);
    // Ada salinan di perangkat → langsung siap dipakai; versi terbaru diambil diam-diam.
    var d = S.data[key] = cached ? { status: 'ok', value: cached.v, at: cached.at, stale: true } : { status: 'loading' };
    if (cached) return; // diperbarui otomatis saat layarnya dibuka (stale → revalidate)
    loader().then(function (v) {
      if (S.data[key] !== d) return;
      S.data[key] = { status: 'ok', value: v, at: Date.now() };
      dcSet(key, v);
      if (visibleKey(key)) rerender();
    }, function () { if (S.data[key] === d) { delete S.data[key]; if (visibleKey(key)) rerender(); } });
  }
  /** Tandai data basi (tetap ditampilkan, lalu diperbarui). Data yang gagal/masih dimuat dibuang. */
  function invalidate() {
    var prefixes = Array.prototype.slice.call(arguments);
    Object.keys(S.data).forEach(function (k) {
      if (!prefixes.length || prefixes.some(function (p) { return k.indexOf(p) === 0; })) {
        if (S.data[k].status === 'ok') S.data[k].stale = true; else delete S.data[k];
      }
    });
  }
  /** Skeleton loading: bentuk mengikuti konten layar. kind 'spin' = proses (bukan konten), tetap spinner. */
  function loadingState(text, kind) {
    if (kind === 'spin') return '<div class="state" role="status"><div class="spinner"></div><p>' + esc(text || 'Memproses…') + '</p></div>';
    return skeleton(kind || skelKind(), text);
  }
  var SKEL_KIND = { dashboard: 'dash', kasir: 'grid', cart: 'list', order: 'detail', receipt: 'detail', reportSales: 'report', reportProducts: 'report', reportFinance: 'report',
    productForm: 'form', variantForm: 'form', expenseForm: 'form', setStore: 'form', setReceipt: 'form', setPassword: 'form' };
  function skelKind() { var t = S.stack[S.stack.length - 1]; return (t && SKEL_KIND[t.name]) || 'list'; }
  function sk(cls) { return '<div class="sk ' + cls + '"></div>'; }
  function skRow() { return '<div class="sk-row">' + sk('sk-thumb') + '<div class="grow">' + sk('sk-line w60') + sk('sk-line w30') + '</div>' + sk('sk-line w30') + '</div>'; }
  function times(n, fn) { var o = ''; for (var i = 0; i < n; i++) o += fn(i); return o; }
  function skeleton(kind, text) {
    var inner;
    if (kind === 'dash') {
      inner = '<div class="kpi-grid">' + times(4, function () { return '<div class="sk-card"><div class="sk-row">' + sk('sk-tile') + sk('sk-line w45') + '</div>' + sk('sk-line lg w80') + '</div>'; }) + '</div>' +
        '<div class="sk-card">' + sk('sk-line lg w45') + '<div class="sk-chips">' + times(5, function () { return sk('sk-thumb'); }) + '</div></div>' +
        '<div class="list-card">' + times(3, skRow) + '</div>';
    } else if (kind === 'grid') {
      inner = sk('sk-search') + '<div class="sk-chips">' + times(4, function () { return sk('sk-pill'); }) + '</div>' +
        '<div class="product-grid">' + times(6, function () { return '<div class="sk-card">' + sk('sk-img') + sk('sk-line lg w80') + sk('sk-line w45') + sk('sk-line w30') + sk('sk-add') + '</div>'; }) + '</div>';
    } else if (kind === 'detail') {
      inner = '<div class="sk-card">' + sk('sk-line lg w45') + sk('sk-line w80') + sk('sk-line w60') + sk('sk-line w80') + sk('sk-line w30') + '</div>' +
        '<div class="list-card">' + times(3, skRow) + '</div>';
    } else if (kind === 'report') {
      inner = '<div class="sk-chips">' + times(3, function () { return sk('sk-pill'); }) + '</div><div class="sk-card">' + sk('sk-line w30') + sk('sk-line lg w60') +
        '<div class="sk" style="height:150px;border-radius:12px"></div></div><div class="list-card">' + times(3, skRow) + '</div>';
    } else if (kind === 'form') {
      inner = '<div class="sk-card">' + times(4, function () { return sk('sk-line w30') + '<div class="sk" style="height:48px;border-radius:12px"></div>'; }) + '</div>';
    } else {
      inner = '<div class="list-card">' + times(6, skRow) + '</div>';
    }
    return '<div class="skel" role="status" aria-busy="true"><span class="sr-only">' + esc(text || 'Memuat data…') + '</span>' + inner + '</div>';
  }
  function errorState(err, retryKey) {
    return '<div class="state error"><div class="ic">' + icon('alert', 'icon-lg') + '</div><h3>Gagal memuat</h3><p>' +
      esc(err && err.message ? err.message : 'Terjadi kesalahan.') + '</p>' +
      '<button class="btn btn-outline" data-act="retry" data-key="' + esc(retryKey || '') + '">' + icon('refresh') + ' Coba lagi</button></div>';
  }
  function emptyState(ic, title, text, btn) {
    return '<div class="state"><div class="ic">' + icon(ic, 'icon-lg') + '</div><h3>' + esc(title) + '</h3>' +
      (text ? '<p>' + esc(text) + '</p>' : '') + (btn || '') + '</div>';
  }
  function guard(d, retryKey, loadingText) {
    if (d.status === 'loading') return loadingState(loadingText);
    if (d.status === 'error') return errorState(d.error, retryKey);
    return null;
  }

  /* --------------------------------------------------------- catalog */
  function ensureCatalog(force) {
    var fresh = S.catalog && (Date.now() - S.catalogAt < 60000);
    if (fresh && !force) return Promise.resolve(S.catalog);
    if (S._catalogP) return S._catalogP;
    S._catalogP = api('catalog').then(function (c) {
      S.catalog = c; S.catalogAt = Date.now(); S._catalogP = null; S.catalogErr = null;
      if (c.channels.indexOf(S.channel) === -1) S.channel = c.channels[0];
      // buang baris keranjang yang produknya sudah tidak aktif
      var before = S.cart.length;
      S.cart = S.cart.filter(function (l) { return !!productById(l.product_id); });
      if (S.cart.length !== before) { cartChanged(); toast('Sebagian item keranjang dihapus karena produknya tidak aktif.', 'warn'); }
      // refresh setelah data berubah: layar katalog yang sudah terbuka ikut diperbarui (stok/harga terbaru)
      var top = current();
      if (force && top && (top.name === 'kasir' || top.name === 'product' || top.name === 'cart')) rerender();
      return c;
    }, function (e) { S._catalogP = null; S.catalogErr = e; throw e; });
    return S._catalogP;
  }
  function productById(id) {
    if (!S.catalog) return null;
    for (var i = 0; i < S.catalog.products.length; i++) if (S.catalog.products[i].product_id === id) return S.catalog.products[i];
    return null;
  }
  function variantById(id) { return S.catalog ? S.catalog.variants[id] : null; }
  function lineKey(pid, vids) { return pid + '|' + vids.slice().sort().join(','); }

  /** Kalkulasi preview (backend tetap menghitung ulang). */
  function linePrice(line, ch) {
    var p = productById(line.product_id);
    if (!p) return null;
    var base = p.prices[ch];
    if (base === null || base === undefined) return null;
    var top = 0;
    for (var i = 0; i < line.variant_ids.length; i++) {
      var v = variantById(line.variant_ids[i]);
      if (!v || v.prices[ch] === null || v.prices[ch] === undefined) return null;
      top += v.prices[ch];
    }
    return { base: base, top: top, unit: base + top, total: (base + top) * line.qty };
  }
  function cartCount() { return S.cart.reduce(function (s, l) { return s + l.qty; }, 0); }
  function cartTotals() {
    var subtotal = 0, missing = [];
    S.cart.forEach(function (l) {
      var p = linePrice(l, S.channel);
      if (!p) missing.push(l); else subtotal += p.total;
    });
    var discount = S.catalog && S.catalog.allow_discount ? (S.discount || 0) : 0;
    var discErr = discount > subtotal ? 'Diskon melebihi subtotal.' : '';
    return { subtotal: subtotal, discount: discount, total: Math.max(subtotal - discount, 0), missing: missing, discErr: discErr };
  }
  /** Kebutuhan stok gabungan lintas baris keranjang (+ baris tambahan opsional). */
  function stockIssues(extraLine, excludeKey) {
    var need = {};
    function add(type, id, q) { var k = type + '|' + id; need[k] = (need[k] || 0) + q; }
    S.cart.forEach(function (l) {
      if (excludeKey && l.key === excludeKey) return;
      add('PRODUCT', l.product_id, l.qty);
      l.variant_ids.forEach(function (v) { add('VARIANT', v, l.qty); });
    });
    if (extraLine) {
      add('PRODUCT', extraLine.product_id, extraLine.qty);
      extraLine.variant_ids.forEach(function (v) { add('VARIANT', v, extraLine.qty); });
    }
    var issues = {};
    Object.keys(need).forEach(function (k) {
      var parts = k.split('|');
      var item = parts[0] === 'PRODUCT' ? productById(parts[1]) : variantById(parts[1]);
      var avail = item ? item.stock.quantity : 0;
      if (need[k] > avail) {
        issues[k] = { name: item ? (item.product_name || item.variant_name) : 'Item', avail: avail, need: need[k], unit: item ? item.stock.unit : '' };
      }
    });
    return issues;
  }
  function lineIssues(line, issues) {
    var out = [];
    var k = 'PRODUCT|' + line.product_id;
    if (issues[k]) out.push(issues[k]);
    line.variant_ids.forEach(function (v) { if (issues['VARIANT|' + v]) out.push(issues['VARIANT|' + v]); });
    return out;
  }
  function variantText(line) {
    var p = productById(line.product_id);
    if (line.variant_ids.length) return line.variant_ids.map(function (v) { var x = variantById(v); return x ? x.variant_name : '?'; }).join(', ');

  function lineChart(daily) {
    if (!daily.length) return '';
    var W = 340, H = 170, L = 40, R = 10, T = 26, B = 26;

    var niceMax = max <= 0 ? 100000 : Math.ceil(max / Math.pow(10, Math.floor(Math.log10(max)))) * Math.pow(10, Math.floor(Math.log10(max)));
    var n = daily.length, step = n > 1 ? (W - L - R) / (n - 1) : 0;
    function x(i) { return n > 1 ? L + i * step : (L + W - R) / 2; }
    function y(v) { return T + (H - T - B) * (1 - v / niceMax); }
    var pts = daily.map(function (d, i) { return x(i).toFixed(1) + ',' + y(d.omzet).toFixed(1); });
    var sel = S.chartSel !== null && S.chartSel < n ? S.chartSel : daily.reduce(function (bi, d, i) { return d.omzet > daily[bi].omzet ? i : bi; }, 0);
    var grid = [0, .5, 1].map(function (f) {
      var gv = niceMax * f;
      return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(gv) + '" y2="' + y(gv) + '" class="c-grid"/><text class="c-lbl" x="' + (L - 6) + '" y="' + (y(gv) + 4) + '" font-size="10" text-anchor="end">' + esc(rpShort(gv).replace('Rp ', '')) + '</text>';
    }).join('');
    var every = Math.ceil(n / 7);
    var labels = daily.map(function (d, i) {
      return (i % every === 0 || i === n - 1) ? '<text x="' + x(i) + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" class="c-lbl">' + fmtDateShort(d.date) + '</text>' : '';

    if (d > 0) {
      var issues = stockIssues({ product_id: l.product_id, variant_ids: l.variant_ids, qty: 1 });

  /* ================================================================ GAMBAR: upload & URL */
  var IMG_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
  var MAX_DIM = 1600; // sisi terpanjang; gambar lebih besar diperkecil sebelum upload (rasio tetap)
  function maxMb() { return (S.settings && S.settings.upload_max_mb) || 5; }
  function normalizeImgUrl(v) {
    v = String(v || '').trim();
    var m = v.match(/^https:\/\/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
    if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w2000';
    return v;
  }
  /** Memastikan URL benar-benar memuat gambar di browser ini (bukan halaman web / akses ditolak). */
  function probeImage(url, ms) {
    return new Promise(function (resolve) {
      var im = new Image(), done = false;
      var t = setTimeout(function () { if (!done) { done = true; resolve({ ok: false, reason: 'Waktu habis saat memuat gambar.' }); } }, ms || 10000);
      im.referrerPolicy = 'no-referrer';
      im.onload = function () { if (done) return; done = true; clearTimeout(t); resolve(im.naturalWidth > 0 ? { ok: true, w: im.naturalWidth, h: im.naturalHeight } : { ok: false, reason: 'File bukan gambar.' }); };
      im.onerror = function () { if (done) return; done = true; clearTimeout(t); resolve({ ok: false, reason: 'Gambar gagal dimuat: link bukan gambar langsung, tidak publik, atau sudah dihapus.' }); };
      im.src = url;
    });
  }
  function imgPrevInner(url, fit, pos, alt) {
    if (!url) return '<div class="img-empty">' + icon('image', 'icon-lg') + '<span class="small">Belum ada foto</span></div>';
    return '<img src="' + esc(url) + '" alt="' + esc(alt || 'Pratinjau foto') + '" referrerpolicy="no-referrer" style="object-fit:' + (fit === 'contain' ? 'contain' : 'cover') +
      ';object-position:' + (POS[pos] || POS.center) + '" data-fallback="prev">';
  }
  function imageField(o) {
    var id = 'img-' + o.name;
    return '<div class="field img-field" id="' + id + '" data-fit="' + o.fit + '" data-alt="' + esc(o.alt || '') + '">' +
      '<span class="label">' + esc(o.label) + '</span>' +
      '<input type="hidden" name="' + o.name + '" value="' + esc(o.value || '') + '">' +
      (o.withPosition ? '<input type="hidden" name="image_position" value="' + esc(o.position || 'center') + '">' : '') +
      '<div class="img-prev ' + o.ratio + '" id="' + id + '-prev">' + imgPrevInner(o.value, o.fit, o.position, o.alt) + '</div>' +
      '<div class="row wrap" style="gap:8px">' +
      '<button type="button" class="btn btn-outline btn-sm" data-act="imgUpload" data-field="' + o.name + '" data-purpose="' + o.purpose + '" data-ref="' + esc(o.ref || '') + '">' + icon('image', 'icon-sm') + ' ' + esc(o.uploadLabel || 'Upload Foto') + '</button>' +
      '<button type="button" class="btn btn-outline btn-sm" data-act="imgUrl" data-field="' + o.name + '">' + icon('edit', 'icon-sm') + ' Pakai URL</button>' +
      '<button type="button" class="btn-text danger" data-act="imgRemove" data-field="' + o.name + '"' + (o.value ? '' : ' hidden') + '>' + esc(o.removeLabel || 'Hapus foto') + '</button></div>' +
      (o.withPosition ? '<div class="row" style="gap:8px"><span class="small muted">Posisi crop</span>' +
        selectHtml('class="select compact" style="width:auto" data-change="imgPosition" data-field="' + o.name + '" aria-label="Posisi crop foto"',
          [['center', 'Tengah'], ['top', 'Atas'], ['bottom', 'Bawah'], ['left', 'Kiri'], ['right', 'Kanan']], o.position || 'center') + '</div>' : '') +
      '<span class="hint">' + esc(o.hint || '') + ' JPG, PNG, WebP, atau GIF, maks. ' + maxMb() + ' MB. Upload disimpan di Google Drive toko.</span>' +
      '<div class="small" id="' + id + '-msg" role="status" aria-live="polite"></div></div>';
  }
  function fieldMsg(name, text, type) {
    var el = document.getElementById('img-' + name + '-msg');
    if (el) { el.textContent = text || ''; el.style.color = type === 'error' ? 'var(--red)' : type === 'ok' ? 'var(--green)' : 'var(--text-2)'; }
  }
  function setFieldImage(name, url) {
    var root = document.getElementById('img-' + name);
    if (!root) return;
    root.querySelector('input[name="' + name + '"]').value = url;
    var posInp = root.querySelector('input[name="image_position"]');
    patch('img-' + name + '-prev', imgPrevInner(url, root.dataset.fit, posInp ? posInp.value : 'center', root.dataset.alt));
    var rm = root.querySelector('[data-act="imgRemove"]');
    if (rm) rm.hidden = !url;
  }
  ACTIONS.imgRemove = function (el) {
    setFieldImage(el.dataset.field, '');
    fieldMsg(el.dataset.field, el.textContent.indexOf('default') !== -1 ? 'Kembali ke default setelah Anda menekan Simpan.' : 'Foto akan dihapus setelah Anda menekan Simpan.', 'info');
  };
  CHANGES.imgPosition = function (el) {
    var root = document.getElementById('img-' + el.dataset.field);
    root.querySelector('input[name="image_position"]').value = el.value;
    var img = root.querySelector('.img-prev img');
    if (img) img.style.objectPosition = POS[el.value] || POS.center;
  };

  /* ---------- upload file ---------- */
  var filePicker = null;
  function pickFile(picker) {
    if (!filePicker) {
      filePicker = document.createElement('input');
      filePicker.type = 'file';
      filePicker.accept = IMG_TYPES.join(',');
      filePicker.style.display = 'none';
      filePicker.id = 'df-file-picker';
      filePicker.addEventListener('change', function () {
        var f = filePicker.files && filePicker.files[0];
        if (f && S.picker) handlePickedFile(f, S.picker);
      });
      document.body.appendChild(filePicker);
    }
    S.picker = picker;
    filePicker.value = '';
    filePicker.click();
  }
  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1]); };
      r.onerror = function () { reject(new Error('Gagal membaca file.')); };
      r.readAsDataURL(blob);
    });
  }
  /** Perkecil hanya bila sisi terpanjang > MAX_DIM (rasio dipertahankan); GIF tidak diubah. */
  function prepareImage(file) {
    if (file.type === 'image/gif') return Promise.resolve(file);
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, MAX_DIM / Math.max(w, h));
        if (k >= 1) { URL.revokeObjectURL(url); resolve(file); return; }
        var c = document.createElement('canvas');
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        var ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { resolve(b || file); }, file.type, 0.9);
      };
      im.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
      im.src = url;
    });
  }
  function handlePickedFile(file, picker) {
    var say = picker.say || function () {};
    if (IMG_TYPES.indexOf(file.type) === -1) { say('Format tidak didukung. Pilih JPG, PNG, WebP, atau GIF.', 'error'); return; }
    var limit = maxMb() * 1048576;
    say('Menyiapkan gambar…', 'info');
    prepareImage(file).then(function (blob) {
      if (!blob) throw { message: 'File tidak bisa dibaca sebagai gambar.' };
      if (blob.size > limit) throw { message: 'Ukuran ' + (blob.size / 1048576).toFixed(1).replace('.', ',') + ' MB melebihi batas ' + maxMb() + ' MB.' };
      say('Mengunggah… (' + Math.max(1, Math.round(blob.size / 1024)) + ' KB)', 'info');
      if (picker.onLocalPreview) picker.onLocalPreview(URL.createObjectURL(blob));
      return blobToBase64(blob).then(function (b64) {
        return api('uploadImage', { purpose: picker.purpose, ref_id: picker.ref || '', filename: file.name, mime_type: blob.type || file.type, base64: b64 });
      });
    }).then(function (res) {
      picker.onDone(res.url);
      say(picker.okText || 'Foto terunggah. Tekan Simpan untuk menerapkan.', 'ok');
    }).catch(function (e) {
      if (picker.onFail) picker.onFail();
      say('Upload gagal: ' + errMsg(e), 'error');
    });
  }
  ACTIONS.imgUpload = function (el) {
    var name = el.dataset.field;
    pickFile({
      purpose: el.dataset.purpose, ref: el.dataset.ref,
      say: function (t, type) { fieldMsg(name, t, type); },
      onLocalPreview: function (u) { var root = document.getElementById('img-' + name); patch('img-' + name + '-prev', imgPrevInner(u, root.dataset.fit, 'center', 'Pratinjau')); },
      onFail: function () { var root = document.getElementById('img-' + name); if (root) setFieldImage(name, root.querySelector('input[name="' + name + '"]').value); },
      onDone: function (url) { setFieldImage(name, url); }
    });
  };

  function openUrlSheet(o) {
    var el = openSheet({ title: o.title || 'Pakai URL gambar', body:
      '<div class="field"><label for="url-in">URL gambar (https)</label><input id="url-in" class="input" type="url" inputmode="url" autocapitalize="none" placeholder="https://…/foto.jpg" value="' + esc(o.current || '') + '" data-input="urlInput" autofocus></div>' +

      '<div class="img-prev ' + (o.ratio || 'r43') + '" id="url-prev">' + imgPrevInner('', o.fit) + '</div>' +
      '<div class="small" id="url-msg" role="status" aria-live="polite"></div>' +
      '<div class="info-box">' + icon('info') + '<span>Gunakan link <b>gambar langsung</b> (biasanya berakhiran .jpg/.png), bukan link halaman web. Link Google Drive "file/d/…/view" otomatis dikonversi, tetapi file Drive harus dibagikan "Siapa saja yang memiliki link". Lebih praktis: pakai tombol Upload Foto.</span></div>',
      footer: '<button class="btn btn-outline" data-act="closeSheet">Batal</button><button class="btn btn-primary" data-act="urlUse" disabled title="Cek gambar terlebih dahulu">Gunakan gambar</button>' });

    var sh = topSheet(); if (!sh) return;

  };

      sh._url = url;

    });

  ACTIONS.iconUrl = function (el) {
    var code = el.dataset.code;
    openUrlSheet({ title: 'URL ikon ' + (chLabel(code) !== code ? chLabel(code) : pmLabel(code)), current: S.settings.brand_logos[code] || '', fit: 'contain', ratio: 'r11',
      onDone: function (url) { S.iconPending[code] = url; iconMsg(code, 'Periksa pratinjau lalu tekan Simpan.', 'info'); render(); } });
  };
  ACTIONS.iconCancel = function (el) { delete S.iconPending[el.dataset.code]; delete S.iconMsg[el.dataset.code]; render(); };
  function saveIcon(code, url, okText) {
    var v = {}; v['brand_logo_' + code] = url;
    iconMsg(code, 'Menyimpan…', 'info');
    return api('saveSettings', { values: v }).then(function (s) {
      S.settings = s; delete S.iconPending[code]; S.iconMsg[code] = { text: okText, type: 'ok' };
      toast(okText); render();
    }).catch(function (e) { iconMsg(code, 'Gagal menyimpan: ' + errMsg(e), 'error'); });
  }
  ACTIONS.iconSave = function (el) { var c = el.dataset.code; saveIcon(c, S.iconPending[c], 'Ikon ' + (chLabel(c) !== c ? chLabel(c) : pmLabel(c)) + ' disimpan'); };
  ACTIONS.iconDefault = function (el) {
    var c = el.dataset.code;
    confirmDialog({ title: 'Kembalikan ikon bawaan?', message: 'Ikon kustom untuk ' + (chLabel(c) !== c ? chLabel(c) : pmLabel(c)) + ' akan dihapus.', confirmText: 'Kembalikan' }).then(function (r) {
      if (r) saveIcon(c, '', 'Ikon bawaan dipulihkan');
    });
  };

  /* ================================================================ Status data (khusus admin) */
  SCREENS.setData = {
    role: 'ADMIN', title: 'Status Data',
    render: function () {
      var demo = S.settings.data_mode === 'DEMO';
      return screenWrap('setData', hdrLight('Status Data') + '<main class="content">' +
        '<div class="card pad stack"><div class="row"><div class="tile ' + (demo ? 'orange' : 'green') + '" style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center">' + icon('info') + '</div>' +
        '<div class="grow"><div class="semibold">' + (demo ? 'Data contoh masih terpasang' : 'Data operasional') + '</div><div class="small muted">' +
        (demo ? 'Spreadsheet pernah diisi dengan seedDemoData(): produk, harga, dan stok contoh dari PRD.' : 'Aplikasi ditandai memakai data asli usaha.') + '</div></div></div></div>' +
        '<div class="info-box' + (demo ? ' warn' : '') + '">' + icon('info') + '<span>Status ini hanya label untuk admin dan <b>tidak menghapus atau mengubah data</b>. ' +
        (demo ? 'Sebelum menandai sebagai data operasional, ganti harga & stok contoh dengan data asli, atau mulai dari spreadsheet baru. Label "DEMO" tidak lagi tampil di layar kasir.' : '') + '</span></div>' +
        '<button class="btn ' + (demo ? 'btn-primary' : 'btn-outline') + ' btn-block" data-act="toggleDataMode">' + (demo ? 'Tandai sebagai data operasional' : 'Tandai sebagai data contoh') + '</button></main>');
    }
  };
  ACTIONS.toggleDataMode = function () {
    var toProd = S.settings.data_mode === 'DEMO';
    confirmDialog({ title: toProd ? 'Tandai sebagai data operasional?' : 'Tandai sebagai data contoh?', confirmText: 'Ya, tandai',
      message: toProd ? 'Pastikan harga dan stok sudah data asli. Data tidak diubah.' : 'Data tidak diubah.' }).then(function (r) {
      if (!r) return;
      api('setDataMode', { mode: toProd ? 'PRODUCTION' : 'DEMO' }).then(function (s) { S.settings = s; toast('Status data diperbarui'); render(); })
        .catch(function (e) { toast(errMsg(e), 'error'); });
    });
  };

  /* ================================================================ STRUK SEBAGAI GAMBAR */
  function loadImg(src, cors) {
    return new Promise(function (resolve) {
      var im = new Image(), done = false;
      if (cors) im.crossOrigin = 'anonymous';
      im.onload = function () { if (!done) { done = true; resolve(im); } };
      im.onerror = function () { if (!done) { done = true; resolve(null); } };
      setTimeout(function () { if (!done) { done = true; resolve(null); } }, 6000);
      im.src = src;
    });
  }
  function bananaDataUrl() {
    var sym = document.getElementById('logo-banana');
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">' + (sym ? sym.innerHTML : '') + '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  /**
   * Menggambar struk ke canvas (PNG 2×, lebar 600 px logis) dari data transaksi yang tersimpan di server.
   * Logo kustom dipakai bila server gambar mengizinkan CORS; jika tidak, memakai logo bawaan agar canvas tidak "tainted".
   */
  function receiptCanvas(o) {
    // 480 px logis × 2,5 = 1200 px: saat dilihat selebar layar HP, teks setara ±14–16 px.
    var st = S.settings.store, W = 480, P = 26, SCALE = 2.5;
    var FONT = "'Inter', system-ui, Arial, sans-serif", DISPLAY = FONT;
    var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    return fontsReady.then(function () {
      if (!S.settings.receipt.receipt_show_logo) return null;
      var url = receiptLogoUrl(o);
      if (!url) return loadImg(bananaDataUrl());
      S.logoCache = S.logoCache || {};
      var p = S.logoCache[url] ? Promise.resolve(S.logoCache[url]) : api('receiptLogo', { url: url }).then(function (r) { if (r.data_url) S.logoCache[url] = r.data_url; return r.data_url; }, function () { return null; });
      return p.then(function (dataUrl) { return dataUrl ? loadImg(dataUrl) : loadImg(url, true); })
        .then(function (im) { return im || loadImg(bananaDataUrl()); });
    }).then(function (logo) {
      function draw(ctx) {
        var y = 0;
        function font(size, weight, fam) { ctx.font = (weight || 400) + ' ' + size + 'px ' + (fam || FONT); }
        function text(str, x, yy, align, color) { ctx.textAlign = align || 'left'; ctx.fillStyle = color || '#1E1A17'; ctx.fillText(str, x, yy); }
        function wrap(str, maxW) {
          var words = String(str).split(/\s+/), lines = [], line = '';
          words.forEach(function (w) { var t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
          if (line) lines.push(line);
          return lines;
        }
        function dashed() {
          y += 14; ctx.strokeStyle = '#CFC7BF'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]);
          ctx.beginPath(); ctx.moveTo(P, y); ctx.lineTo(W - P, y); ctx.stroke(); ctx.setLineDash([]); y += 22;
        }
        function kv(k, v, bold, size) {
          font(size || 18, bold ? 700 : 400); text(k, P, y, 'left', bold ? '#1E1A17' : '#5F5852');
          font(size || 18, bold ? 800 : 600); text(v, W - P, y, 'right'); y += (size || 18) + 12;
        }
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, 4000);
        ctx.fillStyle = '#624737'; ctx.fillRect(0, 0, W, 8);
        y = 40;
        if (logo) {
          var lw = 76, lh = 76, r = Math.min(lw / logo.width, lh / logo.height);
          ctx.drawImage(logo, (W - logo.width * r) / 2, y + (lh - logo.height * r) / 2, logo.width * r, logo.height * r); y += lh + 14;
        }
        ctx.textBaseline = 'alphabetic';
        font(30, 800, DISPLAY); y += 26; text(st.store_name, W / 2, y, 'center'); y += 26;
        font(16, 500); if (st.store_tagline) { text(st.store_tagline, W / 2, y, 'center', '#5F5852'); y += 24; }
        font(15); if (st.store_address) wrap(st.store_address, W - 2 * P).forEach(function (l) { text(l, W / 2, y, 'center', '#5F5852'); y += 20; });
        if (st.store_phone) { text('Telp. ' + st.store_phone, W / 2, y, 'center', '#5F5852'); y += 20; }
        dashed();
        kv('No. Transaksi', o.order_number); kv('Tanggal', fmtDate(o.order_date) + ' ' + o.order_time); kv('Channel', o.channel_label);
        if (o.external_order_id) kv('No. Platform', o.external_order_id);
        kv('Kasir', o.cashier_name);
        dashed();
        o.items.forEach(function (i) {
          font(19, 700);
          var nameLines = wrap(i.product_name, W - 2 * P - 130);
          nameLines.forEach(function (l, idx) { text(l, P, y, 'left'); if (idx === 0) { text(rp(i.line_total), W - P, y, 'right'); } y += 26; });
          font(17, 400);
          if (i.variant_label) wrap('+ ' + i.variant_label, W - 2 * P - 16).forEach(function (l) { text(l, P + 10, y, 'left', '#5F5852'); y += 23; });
          text(i.quantity + ' × ' + rp(i.unit_price + i.topping_total), P + 10, y, 'left', '#5F5852'); y += 23;
          if (i.notes) { font(16, 400); wrap('Catatan: ' + i.notes, W - 2 * P - 16).forEach(function (l) { text(l, P + 10, y, 'left', '#8A827B'); y += 22; }); }
          y += 10;
        });
        y -= 6; dashed();
        kv('Subtotal', rp(o.subtotal)); kv('Diskon', o.discount ? '- ' + rp(o.discount) : rp(0));
        y += 4; kv('TOTAL', rp(o.total), true, 24);
        var p = o.payment;
        if (p) {
          dashed();
          kv('Pembayaran', p.payment_method_label);
          if (p.payment_method === 'CASH') { kv('Uang Diterima', rp(p.received_amount)); kv('Kembalian', rp(p.change_amount)); }
          if (p.status === 'REFUNDED') kv('Status bayar', 'Dikembalikan');
        }
        if (o.status === 'CANCELLED') {
          y += 4; ctx.fillStyle = '#FDEDED'; ctx.fillRect(P, y - 4, W - 2 * P, 40);
          font(18, 800); text('TRANSAKSI DIBATALKAN', W / 2, y + 23, 'center', '#D13A3A'); y += 50;
        }
        dashed();
        font(17, 500);
        String(S.settings.receipt.receipt_footer || '').split('\n').forEach(function (line) {
          wrap(line, W - 2 * P).forEach(function (l) { text(l, W / 2, y, 'center', '#5F5852'); y += 23; });
        });
        y += 24;
        return y;
      }
      var probe = document.createElement('canvas').getContext('2d');
      var H = Math.ceil(draw(probe));
      var c = document.createElement('canvas');
      c.width = W * SCALE; c.height = H * SCALE;
      var ctx = c.getContext('2d');
      ctx.scale(SCALE, SCALE);
      draw(ctx);
      return c;
    });
  }
  function canvasToBlob(c) {
    return new Promise(function (resolve, reject) {
      try { c.toBlob(function (b) { b ? resolve(b) : reject({ message: 'Gagal membuat gambar.' }); }, 'image/png'); }
      catch (e) { reject({ message: 'Gagal membuat gambar: ' + e.message }); }
    });
  }
  function waLink(number, text) {
    var n = String(number || '').replace(/[^\d]/g, '');
    if (n.indexOf('0') === 0) n = '62' + n.substring(1);
    return 'https://wa.me/' + (n || '') + '?text=' + encodeURIComponent(text);
  }
  function waCaption(o) { return 'Halo, berikut struk transaksi ' + S.settings.store.store_name + ' ' + o.order_number + ' (total ' + rp(o.total) + '). Terima kasih!'; }

  ACTIONS.shareReceipt = function (el) {
    var id = el.dataset.id;
    var sheet = openSheet({ title: 'Kirim Struk', body: loadingState('Membuat gambar struk…', 'spin'), footer: '<button class="btn btn-outline" data-act="closeSheet">Tutup</button>' });
    // Ambil ulang dari server agar gambar = data transaksi yang tersimpan, bukan state browser.
    api('orderDetail', { order_id: id }).then(function (o) {
      S.data['order|' + id] = { status: 'ok', value: o };
      return receiptCanvas(o).then(canvasToBlob).then(function (blob) { return { o: o, blob: blob }; });
    }).then(function (r) {
      if (!sheet.parentNode) return;
      var o = r.o, fname = 'Struk-' + o.order_number + '.png';
      var file = null;
      try { file = new File([r.blob], fname, { type: 'image/png' }); } catch (e) { file = null; }
      var canFiles = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
      var url = URL.createObjectURL(r.blob);
      sheet._file = file; sheet._order = o; sheet._blobUrl = url;
      sheet.querySelector('.sheet-bd').innerHTML =
        '<img class="receipt-img" src="' + url + '" alt="Gambar struk ' + esc(o.order_number) + '">' +
        '<p class="xs faint" style="text-align:center">Gambar ' + Math.round(r.blob.size / 1024) + ' KB · tekan lama gambar untuk menyimpan bila tombol unduh tidak berfungsi.</p>' +
        '<div class="field"><label for="wa-num">Nomor WhatsApp pelanggan <span class="muted" style="font-weight:400">(opsional)</span></label>' +
        '<input id="wa-num" class="input" inputmode="tel" placeholder="08xxxxxxxxxx" data-input="waNumber"></div>' +
        '<div class="info-box">' + icon('info') + '<span>' + (canFiles
          ? '<b>Bagikan gambar</b> membuka menu berbagi perangkat; pilih WhatsApp lalu kirim. Jika tombol itu gagal, pakai <b>Unduh gambar</b> lalu <b>Buka WhatsApp</b> dan lampirkan gambar secara manual.'
          : 'Browser ini tidak bisa berbagi file langsung. Tekan <b>Unduh gambar</b>, lalu <b>Buka WhatsApp</b> dan lampirkan gambar yang sudah diunduh (ikon klip/galeri).') + '</span></div>';
      sheet.querySelector('.sheet-ft').innerHTML =
        '<button class="btn btn-primary btn-block" data-act="shareImage"' + (canFiles ? '' : ' disabled title="Browser tidak mendukung berbagi file gambar"') + '>' + icon('share') + ' Bagikan gambar</button>' +
        '<a class="btn btn-outline btn-block" href="' + url + '" download="' + esc(fname) + '">' + icon('file') + ' Unduh gambar</a>' +
        '<a class="btn btn-outline btn-block" id="wa-link" href="' + esc(waLink('', waCaption(o))) + '" target="_blank" rel="noopener">' + icon('phone') + ' Buka WhatsApp</a>' +
        '<button class="btn-text btn-block" data-act="copyReceiptText">Salin ringkasan teks</button>';
    }).catch(function (e) {
      if (!sheet.parentNode) return;
      sheet.querySelector('.sheet-bd').innerHTML = '<div class="info-box danger">' + icon('alert') + '<span>' + esc(errMsg(e)) + '</span></div>';
    });
  };
  INPUTS.waNumber = function (el) {
    var sh = topSheet(); if (!sh || !sh._order) return;
    var a = sh.querySelector('#wa-link'); if (a) a.href = waLink(el.value, waCaption(sh._order));
  };
  ACTIONS.shareImage = function () {
    var sh = topSheet(); if (!sh || !sh._file) return;
    navigator.share({ files: [sh._file], text: waCaption(sh._order), title: 'Struk ' + sh._order.order_number }).then(function () {
      // Menu share tidak memberi tahu apakah pesan benar-benar terkirim.
      toast('Gambar diteruskan ke aplikasi pilihan. Pastikan pesan terkirim di WhatsApp.', 'info');
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      toast('Berbagi file ditolak browser (' + (e && e.name ? e.name : 'error') + '). Gunakan Unduh gambar lalu Buka WhatsApp.', 'warn');
    });
  };
  ACTIONS.copyReceiptText = function () {
    var sh = topSheet(); if (!sh || !sh._order) return;
    var t = receiptText(sh._order);
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('Ringkasan teks disalin'); }, function () { toast('Tidak bisa menyalin otomatis di browser ini.', 'warn'); });
  };

  /* ================================================================ events */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    // Backdrop sheet hanya bereaksi bila yang diklik backdrop itu sendiri; klik di dalam sheet
    // (mis. tombol submit form) tidak boleh di-preventDefault.
    if (el.classList.contains('sheet-backdrop') && e.target !== el) return;
    var fn = ACTIONS[el.dataset.act];
    if (!fn) { console.error('[DashFood] handler tidak ada:', el.dataset.act); return; }
    if (el.tagName !== 'A' || !el.getAttribute('href')) e.preventDefault();
    fn(el, e);
  });
  document.addEventListener('input', function (e) {
    var el = e.target.closest('[data-input]');
    if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el, e);
  });
  document.addEventListener('change', function (e) {
    var el = e.target.closest('[data-change]');
    if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e);
  });
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-submit]');
    if (!f) return;
    e.preventDefault();
    var fn = SUBMITS[f.dataset.submit];
    if (fn) fn(f, e); else console.error('[DashFood] submit handler tidak ada:', f.dataset.submit);
  });
  // Fallback gambar gagal dimuat (event error tidak bubble → capture).
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'IMG' || !t.dataset.fallback) return;
    var kind = t.dataset.fallback, parent = t.parentNode;
    if (kind === 'ph') parent.innerHTML = phFallback(t.dataset.name || '');
    else if (kind === 'brand') parent.innerHTML = brandInner(t.dataset.code);
    else if (kind === 'prev') parent.innerHTML = '<div class="img-empty error">' + icon('alert', 'icon-lg') + '<span class="small">Gambar gagal dimuat</span></div>';
    else if (kind === 'logo') t.outerHTML = '<svg class="' + esc(t.getAttribute('class') || '') + ' default" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo-banana"></use></svg>';
    else t.style.display = 'none';
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheetStack.length) closeSheet(); });
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (!t || !t.matches || !t.matches('input, textarea, select')) return;
    setTimeout(function () { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) { /* no-op */ } }, 300);
  });

  /* ================================================================ viewport */
  /**
   * Chrome Android mode "Desktop Site" memaksa viewport ±980px sehingga UI tampak sangat kecil.
   * Deteksi berbasis kemampuan (pointer coarse + viewport jauh lebih lebar dari layar fisik),
   * bukan user-agent. Root di-zoom dan layout lebar dimatikan lewat class .zoom-fix.
   */
  function fitViewport() {
    var root = document.documentElement;
    var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    var sw = window.screen ? Math.min(screen.width, screen.height) : 0;
    var iw = window.innerWidth;
    if (coarse && sw && sw < 820 && iw > sw * 1.3) {
      var z = iw / Math.max(sw, 320);
      root.style.zoom = z.toFixed(3);
      root.classList.add('zoom-fix');
    } else {
      root.style.zoom = '';
      root.classList.remove('zoom-fix');
    }
  }
  window.addEventListener('resize', debounce(fitViewport, 150));

  /* ================================================================ boot */
  function boot() {
    fitViewport();
    // Info publik sudah disisipkan server di HTML -> layar login tampil tanpa menunggu API.
    S.pub = window.__BOOT_PUBLIC || store('pub') || null;
    if (!S.token) {
      if (S.pub) {
        render();
        // PWA: info publik dari cache → segarkan diam-diam (logo/nama bisa berubah).
        if (!window.__BOOT_PUBLIC) api('publicInfo').then(function (p) { S.pub = p; store('pub', p); if (!S.user) render(); }, function () { /* pakai cache */ });
        return;
      }
      api('publicInfo').then(function (p) { S.pub = p; store('pub', p); render(); }, function (e) { app.innerHTML = '<div class="screen">' + errorState(e, '__boot') + '</div>'; });
      return;
    }
    // Buka ulang aplikasi: tampilkan sesi & data terakhir dari perangkat SEKETIKA, lalu segarkan lewat bootstrap.
    var bc = store('bootc');
    if (bc && bc.user && bc.settings) {
      S.user = bc.user; S.settings = bc.settings; S.enums = bc.enums; S.labels = bc.labels; S.today = bc.today;
      if (S.settings.channels_enabled && S.settings.channels_enabled.indexOf(S.channel) === -1) S.channel = S.settings.channels_enabled[0];
      var cat = dcGet('catalog');
      if (cat) { S.catalog = cat.v; S.catalogAt = 0; }
      var dash = dcGet('dash|today');
      // Angka "Hari ini" dari kemarin tidak ditampilkan: hanya dipakai bila tanggalnya sama.
      if (dash && bc.today === deviceToday()) S.data['dash|today'] = { status: 'ok', value: dash.v, at: Date.now() };
      S.stack = [{ name: 'dashboard', params: {} }];
      render();
      startSession({ background: true }).catch(function (e) {
        if (e.code === 'AUTH_REQUIRED') { dcClear(); store('bootc', null); S.user = null; S.token = null; store('token', null); S.data = {}; render(); return; }
        toast('Belum terhubung ke server. Menampilkan data terakhir di perangkat ini.', 'warn');
      });
      return;
    }
    startSession().catch(function (e) {
      if (e.code !== 'AUTH_REQUIRED') { app.innerHTML = '<div class="screen">' + errorState(e, '__boot') + '</div>'; return; }
      S.token = null; store('token', null); render();
    });
  }
  var origRetry = ACTIONS.retry;
  ACTIONS.retry = function (el) { if (el.dataset.key === '__boot') { app.innerHTML = '<div class="boot-skel">' + skeleton('dash', 'Memuat Dash Food…') + '</div>'; boot(); return; } origRetry(el); };

  // Hook untuk test otomatis (tidak dipakai UI).
  window.__DF = { S: S, ACTIONS: ACTIONS, INPUTS: INPUTS, CHANGES: CHANGES, SUBMITS: SUBMITS, SCREENS: SCREENS, go: go, render: render, ensureCatalog: ensureCatalog };
  boot();
})();
</script>
